name: Web-App auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@v1.10.17

      - name: Dioxus CLI installieren
        run: cargo binstall dioxus-cli@0.6.3 --no-confirm --force

      # Pages serves the app under /<repo-name>/
      - name: Base-Path setzen
        run: sed -i '/^\[web.app\]/a base_path = "${{ github.event.repository.name }}"' Dioxus.toml

      - name: Web-App bauen
        run: ./build-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
