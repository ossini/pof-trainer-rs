[package]
name = "pof-trainer"
version = "0.1.0"
edition = "2021"
authors = ["Oskar Sobania"]
description = "PPL Trainer – Principles of Flight (offline, Fortschritt bleibt auf dem Gerät)"

[dependencies]
dioxus = { version = "=0.6.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "console"] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
